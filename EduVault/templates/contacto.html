{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- Animate.css for entry animations -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>


<style>
  /* Container */
  .contact-container {
    background: linear-gradient(135deg, #1f1f1f, #2c2c2c);
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(255, 193, 7, 0.3);
    padding: 50px;
    color: white;
  }

  /* Logo styling */
  .logo-container {
    border: 8px solid #ffc107;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(255, 193, 7, 0.7), inset 0 0 20px rgba(0,0,0,0.8);
    transition: transform 0.3s ease;
    display: inline-block;
  }
  .logo-container:hover {
    transform: scale(1.05);
  }
  .logo-img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Section title */
  .contact-title {
    font-size: 3rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #ffc107;
    margin-bottom: 10px;
    text-shadow: 0 0 15px rgba(255, 193, 7, 0.8);
  }
  .sub-text {
    font-size: 1.2rem;
    color: #aaa;
    margin-bottom: 40px;
  }

  /* Credits Card */
  .contact-card {
    background: #2d2d2d;
    border: 2px solid #ffc107;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 0 20px rgba(255, 193, 7, 0.4);
    margin-bottom: 30px;
    transition: transform 0.3s ease;
    max-width: 100%;
    word-wrap: break-word;
  }
  .contact-card:hover {
    transform: translateY(-5px);
  }
  .contact-card h4 {
    font-size: 1.5rem;
    color: #ffc107;
    margin-bottom: 1rem;
  }

  /* Widget actions */
  .contact-actions {
    margin-top: 0.5rem;
  }
  .contact-actions a {
    font-size: 1.5rem;
    color: #ffc107;
    margin: 0 0.5rem;
    transition: color 0.2s ease;
  }
  .contact-actions a:hover {
    color: #ffea00;
  }

  /* Credits list */
  .credits-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .credits-list li {
    font-size: 1.1rem;
    color: #ddd;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    text-align: center;
    width: 100%;
  }
  .credits-list li:last-child {
    border-bottom: none;
  }
  .credits-list .bi-person-fill {
    margin-right: 10px;
    color: #ffc107;
  }
  .credits-list strong {
    font-size: 1.2rem;
    color: #ffc107;
  }

  /* Responsive fixes */
  @media (max-width: 767px) {
    .contact-title {
      font-size: 1.3rem;
      padding: -100px;
   
    }
    .contact-card {
      padding: 20px;
    }
    .contact-card h4 {
      font-size: 1.2rem;
    }
    .credits-list li {
      font-size: 1rem;
    }
  }
</style>

<div class="container py-5">
  <div class="contact-container mx-auto text-center animate__animated animate__fadeInUp" style="max-width: 800px;">

    <!-- Universidad Logo linked -->
    <a href="https://www.uniminuto.edu" target="_blank" class="logo-container mx-auto mb-4" style="max-width: 300px;">
