{% extends "base.html" %}

{% block content %}
<h2>¿Estás seguro que deseas eliminar el archivo "{{ archivo.titulo }}"?</h2>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'mis_archivos' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
